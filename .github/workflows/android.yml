name: Build FirstCode Lock APK
on:
  push:
    paths: ['app/**', '*.kts', 'gradle.properties', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test, lint, and build signed debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify APK signature and permissions
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then exit 1; fi
          mkdir -p deliverable
          cp "$APK" deliverable/FirstCode-Lock-0.1.0-test.apk
          sha256sum deliverable/*.apk > deliverable/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FirstCode-Lock-0.1.0-test-APK
          path: deliverable/
          retention-days: 30
